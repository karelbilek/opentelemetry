version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/karelbilek
plugins:
  - local: ["go", "tool", "-modfile=tools.mod", "protoc-gen-go"]
    out: .
    opt: module=github.com/karelbilek/opentelemetry
inputs:
  - directory: opentelemetry-proto
